name: 打包 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|Dependency |compileSdk|Android Gradle plugin|requires|^ +[0-9]+\\. " build.log | grep -v "^> Task" | sort -u | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build::${msg}"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/今天吃啥-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 今天吃啥-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 今天吃啥 v1.0.${{ github.run_number }}
          body: 下载下面的 .apk 文件，在安卓手机上打开安装。
          files: out/*.apk
