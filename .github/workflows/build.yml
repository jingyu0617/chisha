name: 打包 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:testDebugUnitTest :app:assembleRelease --console=plain --continue 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/app.apk

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|Dependency |compileSdk|Android Gradle plugin|requires|^ +[0-9]+\\. |FAILED|AssertionError|expected:" build.log | grep -v "^> Task" | sort -u | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build::${msg}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/smoke.sh

      - name: Save crash log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          for f in crash.txt monkey.log logcat.txt build.log; do [ -f "$GITHUB_WORKSPACE/$f" ] && tail -c 200000 "$GITHUB_WORKSPACE/$f" > "$f"; done
          [ -f "$GITHUB_WORKSPACE/logcat.txt" ] && grep -E "AndroidRuntime|FATAL|Exception|app.chisha" "$GITHUB_WORKSPACE/logcat.txt" | tail -300 > logcat-app.txt
          git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Name APK
        run: cp out/app.apk "out/chisha-v1.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 今天吃啥 v1.0.${{ github.run_number }}
          body: 下载下面的 chisha-v1.0.${{ github.run_number }}.apk，在安卓手机上打开安装。
          files: out/chisha-v1.0.${{ github.run_number }}.apk

